<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>바느질 연습장 – 옷의 간단한 수선</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--teal:#1aa0a6;--teal-d:#0f7a80;--teal-l:#d9f3f4;--coral:#ef6f5e;--sun:#ffd34d;--ink:#26323a;--paper:#fffdf6;--ok:#1fae6b}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Gowun Dodum','Malgun Gothic',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.jua,h1,h2,h3,button,.tab{font-family:'Jua','Gowun Dodum',sans-serif;font-weight:400}
header{background:var(--teal);color:#fff;padding:10px 20px 0;position:sticky;top:0;z-index:10;box-shadow:0 3px 10px #0002}
header .row{display:flex;align-items:center;gap:12px}
header h1{font-size:28px;flex:1}
header a{color:#fff;text-decoration:none;background:#ffffff33;padding:4px 14px;border-radius:20px;font-family:Jua;font-size:16px}
nav{scrollbar-width:none;display:flex;gap:6px;overflow-x:auto;padding-top:8px}
.tab{flex:none;background:#ffffff2a;color:#fff;border:0;border-radius:16px 16px 0 0;padding:10px 20px;font-size:21px;cursor:pointer}
.tab.on{background:var(--paper);color:var(--teal-d)}
main{max-width:1000px;margin:0 auto;padding:18px 16px 60px}
.panel{display:none}.panel.on{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
h2{font-size:30px;color:var(--teal-d);margin-bottom:4px}
.lead{font-size:20px;color:#5b6b73;margin-bottom:14px}
.btn{background:var(--teal);color:#fff;border:0;border-radius:30px;padding:12px 28px;font-size:22px;box-shadow:0 5px 0 var(--teal-d);cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--teal-d)}
.btn.coral{background:var(--coral);box-shadow:0 5px 0 #c24a3a}
.btn.ghost{background:#fff;color:var(--teal-d);border:3px solid var(--teal);box-shadow:none}
.pills{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.pill{background:#fff;border:3px solid var(--teal-l);color:var(--teal-d);border-radius:30px;padding:8px 22px;font-size:22px;cursor:pointer}
.pill.on{background:var(--teal);color:#fff;border-color:var(--teal)}
/* tools */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.tcard{background:#fff;border:3px solid var(--teal-l);box-shadow:0 5px 0 var(--teal-l);border-radius:22px;padding:12px;text-align:center;cursor:pointer;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tcard svg{width:90px;height:90px}
.tcard b{font-family:Jua;font-weight:400;font-size:24px;color:var(--teal-d)}
.tcard p{font-size:17px;line-height:1.35;display:none}
.tcard.open{background:var(--teal-l)}.tcard.open svg{width:56px;height:56px}.tcard.open p{display:block}
.quiz{background:#fff;border:3px solid var(--teal-l);border-radius:26px;padding:20px;margin-top:22px;text-align:center}
.quiz .q{font-size:26px;margin:8px 0 14px;font-family:Jua}
.quiz .pic{width:150px;height:150px;margin:0 auto}
.quiz .desc{font-size:26px;background:#fff4cf;border-radius:20px;padding:18px;margin:0 auto 14px;max-width:560px;line-height:1.4}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:560px;margin:0 auto}
.opt{background:#fff;border:3px solid var(--teal);color:var(--teal-d);border-radius:20px;padding:16px;font-size:24px;cursor:pointer}
.opt.good{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.bad{background:#ffd5d0;border-color:var(--coral);color:#a33}
.prog{height:12px;background:var(--teal-l);border-radius:8px;overflow:hidden;margin-bottom:6px}.prog i{display:block;height:100%;background:var(--teal);transition:width .3s}
/* order */
.slots{display:grid;gap:10px;margin-bottom:18px}
.slot{display:flex;align-items:center;gap:12px;min-height:62px;background:#f1ece0;border:3px dashed #d9cfb6;border-radius:18px;padding:8px 16px;font-size:21px}
.slot .n{flex:none;width:38px;height:38px;border-radius:50%;background:#cfc6ae;color:#fff;display:grid;place-items:center;font-family:Jua;font-size:22px}
.slot.f{background:#e5f8ef;border:3px solid var(--ok)}.slot.f .n{background:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:#fff;border:3px solid var(--teal);border-radius:18px;padding:14px 18px;font-size:21px;cursor:pointer;text-align:left;max-width:100%;font-family:inherit;color:var(--ink);box-shadow:0 4px 0 var(--teal-l)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* stitch / button svg */
.board{background:#fff;border:3px solid var(--teal-l);border-radius:26px;padding:10px;touch-action:none}
.board svg{width:100%;height:auto;display:block}
.say{background:#fff4cf;border:3px dashed #e7b92f;border-radius:20px;padding:12px 18px;font-size:23px;margin-bottom:12px;min-height:104px;display:flex;align-items:center;gap:10px}
.pulse{animation:pulse 1s infinite;transform-box:fill-box;transform-origin:center}
@keyframes flashk{from{transform:scale(.3);opacity:1}to{transform:scale(1.6);opacity:0}}.flash{animation:flashk .5s both;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.35);opacity:.55}}
.msg{font-family:Jua;font-size:26px;color:var(--ok);text-align:center;margin:10px 0;height:40px;overflow:hidden}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:10px}
/* eval */
.ev{display:grid;gap:12px}
.ev .r{display:flex;align-items:center;gap:14px;background:#fff;border:3px solid var(--teal-l);border-radius:20px;padding:12px 18px;font-size:21px;flex-wrap:wrap}
.ev .r span{flex:1;min-width:230px}
.face{font-size:40px;background:none;border:3px solid transparent;border-radius:50%;width:60px;height:60px;cursor:pointer;filter:grayscale(1);opacity:.55}
.face.on{filter:none;opacity:1;border-color:var(--teal);background:var(--teal-l)}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:12px 0 26px}
.stamp{background:#fff;border:3px dashed #d9cfb6;border-radius:20px;padding:10px;text-align:center;font-size:18px;color:#aaa}
.stamp .e{font-size:42px;filter:grayscale(1);opacity:.35}
.stamp.got{border:3px solid var(--sun);background:#fff9dc;color:var(--ink)}.stamp.got .e{filter:none;opacity:1}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,120px);background:var(--ink);color:#fff;padding:12px 26px;border-radius:30px;font-family:Jua;font-size:22px;transition:transform .35s;z-index:30}
.toast.on{transform:translate(-50%,0)}
@media(max-width:600px){header h1{font-size:22px}.opts{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="row"><h1>🧵 바느질 연습장</h1><a href="slides.html">슬라이드</a><a href="index.html">처음으로</a></div>
  <nav id="nav"></nav>
</header>
<main>
  <section class="panel" id="p-tools"></section>
  <section class="panel" id="p-order"></section>
  <section class="panel" id="p-stitch"></section>
  <section class="panel" id="p-button"></section>
  <section class="panel" id="p-eval"></section>
</main>
<div class="toast" id="toast"></div>
<script src="art.js"></script>
<script>
const $ = (s, r = document) => r.querySelector(s);
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k, d) { try { const v = localStorage.getItem('sew-' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('sew-' + k, JSON.stringify(v)); } catch (e) {} }
};
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 2200); }
const STAMPS = [
  ['quiz', '🧰', '도구 박사'], ['order0', '📋', '수선 과정 순서'], ['order1', '🧵', '시작매듭 순서'], ['order2', '🪢', '끝매듭 순서'],
  ['running', '🟢', '홈질'], ['back', '🔵', '박음질'], ['basting', '🟠', '시침질'], ['two', '🔘', '두 구멍 단추'], ['shank', '🟡', '기둥 단추']
];
function stamp(k) {
  const s = store.get('stamps', {}); if (s[k]) return;
  s[k] = 1; store.set('stamps', s); toast('🎉 도장을 받았어요! ' + STAMPS.find(x => x[0] === k)[2]); renderEval();
}

/* ---------- 탭 ---------- */
const TABS = [['tools', '🧰 도구'], ['order', '🔢 순서'], ['stitch', '🪡 바늘땀'], ['button', '🔘 단추 달기'], ['eval', '⭐ 평가']];
$('#nav').innerHTML = TABS.map(([k, t]) => `<button class="tab" data-k="${k}">${t}</button>`).join('');
function tab(k) {
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.k === k));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id === 'p-' + k));
  store.set('tab', k); scrollTo(0, 0);
}
$('#nav').onclick = e => { const b = e.target.closest('.tab'); if (b) tab(b.dataset.k); };

/* ---------- 1. 도구 ---------- */
const TOOLS = [
  ['옷감', ART.fabric, '바느질의 바탕이 되는 천'], ['시침 핀', ART.pin, '바느질을 하기 위해 옷감을 고정할 때 사용'],
  ['자', ART.ruler, '길이를 재거나 바느질선을 그을 때 사용'], ['바늘', ART.needle, '옷감을 바느질할 때 사용'],
  ['실', ART.thread, '바늘에 연결하여 옷감을 꿰맬 때 사용'], ['초크', ART.chalk, '옷감에 바느질 선을 그을 때 사용'],
  ['가위', ART.scissors, '실을 자를 때 사용'], ['골무', ART.thimble, '바늘귀를 밀 때, 손가락을 바늘로부터 보호하기 위해 사용'],
  ['바늘꽂이', ART.pincushion, '쓰지 않는 바늘과 시침 핀을 꽂아 둘 때 사용'], ['마름질 가위', ART.bigScissors, '옷감을 필요한 모양으로 자를 때 사용']
];
let quiz = null;
function renderTools() {
  $('#p-tools').innerHTML = `<h2>손바느질 재료와 도구</h2><p class="lead">카드를 눌러 어디에 쓰는지 알아봐요. 다 보면 퀴즈에 도전!</p>
   <div class="tgrid">${TOOLS.map((t, i) => `<div class="tcard" data-i="${i}">${t[1]}<b>${t[0]}</b><p>${t[2]}</p></div>`).join('')}</div>
   <div class="quiz" id="quiz"></div>`;
  $('#p-tools .tgrid').onclick = e => { const c = e.target.closest('.tcard'); if (c) c.classList.toggle('open'); };
  renderQuiz();
}
function renderQuiz() {
  const el = $('#quiz'), best = store.get('quizBest', null);
  if (!quiz) {
    el.innerHTML = `<h3 class="jua" style="font-size:28px;color:var(--teal-d)">도구 퀴즈</h3><p class="lead">그림을 보고 이름을 맞히거나, 쓰임새를 보고 도구를 골라요. (10문제)${best != null ? `<br>내 최고 점수: <b>${best}점</b>` : ''}</p>
      <button class="btn coral" id="qstart">퀴즈 시작!</button>`;
    $('#qstart').onclick = () => { quiz = { qs: shuffle(TOOLS).map(t => ({ t, mode: Math.random() < .5 ? 'pic' : 'use' })), i: 0, score: 0, done: false }; renderQuiz(); };
    return;
  }
  if (quiz.i >= quiz.qs.length) {
    const sc = quiz.score * 10;
    if (best == null || sc > best) store.set('quizBest', sc);
    if (sc >= 80) stamp('quiz');
    el.innerHTML = `<div class="pic">${ART.kid('#2b2b3a', '#4fa3d9', sc >= 80 ? 'wow' : 'smile')}</div><div class="q">${quiz.score} / ${quiz.qs.length} 맞혔어요! ${sc >= 80 ? '🎉 대단해요!' : '조금만 더 연습해요!'}</div>
      <button class="btn" id="qagain">다시 도전</button>`;
    $('#qagain').onclick = () => { quiz = null; renderQuiz(); };
    return;
  }
  const { t, mode } = quiz.qs[quiz.i];
  const opts = shuffle([t, ...shuffle(TOOLS.filter(x => x !== t)).slice(0, 3)]);
  el.innerHTML = `<div class="prog"><i style="width:${quiz.i / quiz.qs.length * 100}%"></i></div>
   <div class="q">${quiz.i + 1}번 · ${mode === 'pic' ? '이 도구의 이름은 무엇일까요?' : '이런 일을 할 때 쓰는 도구는?'}</div>
   ${mode === 'pic' ? `<div class="pic">${t[1]}</div>` : `<div class="desc">${t[2]}</div>`}
   <div class="opts">${opts.map((o, k) => `<button class="opt" data-k="${k}">${o[0]}</button>`).join('')}</div>`;
  let locked = false;
  el.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if (locked) return;
    const ok = opts[b.dataset.k] === t;
    if (ok) { locked = true; quiz.score++; b.classList.add('good'); setTimeout(() => { quiz.i++; renderQuiz(); }, 700); }
    else { locked = true; b.classList.add('bad', 'shake'); el.querySelectorAll('.opt').forEach(o => { if (opts[o.dataset.k] === t) o.classList.add('good'); }); setTimeout(() => { quiz.i++; renderQuiz(); }, 1300); }
  });
}

/* ---------- 2. 순서 ---------- */
const ORDERS = [
  { name: '수선하는 과정', items: ['망가진 부분을 확인하고 바느질 방법 계획하기', '도구 준비하기', '바늘에 실을 꿰고 시작매듭 짓기', '바느질하기', '끝매듭 짓기', '도구 정리하기'] },
  { name: '실 꿰기와 시작매듭', items: ['바늘귀에 꿰기 쉽도록 실을 깔끔하게 자른다', '바늘귀에 실 끝을 꿴다', '실 끝을 집게손가락에 한 바퀴 감는다', '엄지·집게손가락으로 밀어 매듭 고리를 만든다', '고리를 실 끝으로 잡아당겨 매듭을 짓는다'] },
  { name: '끝매듭 짓기', items: ['옷감 안쪽에서 매듭짓기를 시작한다', '바늘 끝에 실을 두세 번 감는다', '감은 실을 누르며 바늘을 빼내 매듭을 짓는다', '가위로 실을 조금 남기고 자른다'] }
];
let ordSet = 0, ordState = null;
function renderOrder() {
  const o = ORDERS[ordSet];
  if (!ordState || ordState.set !== ordSet) ordState = { set: ordSet, n: 0, chips: shuffle(o.items.map((t, i) => [i, t])) };
  const st = ordState, done = st.n >= o.items.length;
  $('#p-order').innerHTML = `<h2>순서대로 눌러 보세요</h2><p class="lead">처음 할 일부터 차례대로 눌러요. 틀리면 흔들려요!</p>
   <div class="pills">${ORDERS.map((x, i) => `<button class="pill ${i === ordSet ? 'on' : ''}" data-s="${i}">${x.name}</button>`).join('')}</div>
   <div class="slots">${o.items.map((t, i) => `<div class="slot ${i < st.n ? 'f' : ''}"><span class="n">${i + 1}</span>${i < st.n ? t : ''}</div>`).join('')}</div>
   ${done ? `<div class="msg">🎉 순서를 모두 맞혔어요!</div><div class="actions"><button class="btn" id="oagain">다시 섞기</button></div>`
     : `<div class="chips">${st.chips.filter(c => c[0] >= st.n).map(c => `<button class="chip" data-i="${c[0]}">${c[1]}</button>`).join('')}</div>`}`;
  $('#p-order .pills').onclick = e => { const b = e.target.closest('.pill'); if (b) { ordSet = +b.dataset.s; ordState = null; renderOrder(); } };
  if (done) { stamp('order' + ordSet); $('#oagain').onclick = () => { ordState = null; renderOrder(); }; return; }
  $('#p-order .chips').onclick = e => {
    const b = e.target.closest('.chip'); if (!b) return;
    if (+b.dataset.i === st.n) { st.n++; renderOrder(); }
    else { b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); }
  };
}

/* ---------- 3. 바늘땀: 홈질·박음질·시침질 모두 바늘을 자유롭게 움직여 바느질 ---------- */
let stType = 'running', penSeen = false, raf = 0, guideOn = true;
const SW = 900, SH = 330, FR_MIN_Y = 62, FR_MAX_Y = 248;
const TIPS = {
  running: '겉과 안의 바늘땀 길이를 같게, 한 방향으로 한 땀씩 나아가요.',
  back: '한 땀 뒤로 갔다가 앞으로 두 땀! 겉의 바늘땀이 빈틈없이 이어져야 해요.',
  basting: '겉은 길게, 안은 짧게! 바늘땀 길이를 3 : 1 정도로 해요.'
};
const MIN_F = { running: 4, back: 4, basting: 3 };
let fr = null;
function newFr() { return { stitches: [], pos: { x: 450, y: 290 }, mode: 'under', first: true, drag: null, pull: null, flash: null, praiseUntil: 0 }; }

function needleG(x, y, ang, faded) {
  return `<g transform="translate(${x} ${y}) rotate(${ang})" opacity="${faded ? .6 : 1}" style="filter:drop-shadow(0 4px 3px #0003)">
    <path d="M0 0 L-70 -4.5 L-98 -4.5 L-98 4.5 L-70 4.5Z" fill="#d5dde4" stroke="#7d8996" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="-88" cy="0" rx="6" ry="2" fill="#5f6b77"/><line x1="-66" y1="-2" x2="-6" y2="-0.6" stroke="#fff" stroke-width="1.5" stroke-opacity=".8"/></g>`;
}
function stRef() {
  const s = STITCH[stType];
  $('#stref').innerHTML = `<div style="width:240px;flex:none">${ART.stitch(stType, 360, 130)}</div>
    <div style="font-size:19px;line-height:1.45"><b style="font-size:23px;color:var(--teal-d)">${s.name}</b> — ${s.use}<br><span style="color:#6b7b83">${TIPS[stType]}</span></div>`;
}
function renderStitchShell() {
  fr = newFr();
  $('#p-stitch').innerHTML = `<h2>바늘땀 연습</h2><p class="lead">펜(손가락도 돼요)으로 <b>바늘을 잡고 마음대로</b> 움직여 보세요. 천 위에서 펜을 떼면 그곳으로 바늘이 들어가고(올라오고) 실이 팽팽해져요.</p>
   <div class="pills">${Object.keys(STITCH).map(k => `<button class="pill ${k === stType ? 'on' : ''}" data-k="${k}">${STITCH[k].name}</button>`).join('')}</div>
   <div id="stref" style="display:flex;gap:14px;align-items:center;background:#fff;border:3px solid var(--teal-l);border-radius:20px;padding:8px 14px;margin-bottom:12px"></div>
   <div class="say" id="say"></div><div class="board"><svg id="stsvg" viewBox="0 0 ${SW} ${SH}" style="touch-action:none"></svg></div><div class="msg" id="stmsg"></div>
   <div class="actions"><button class="btn ghost" id="streset">처음부터</button><button class="btn ghost" id="frundo">↩ 되돌리기</button><button class="btn ghost" id="frguide">📏 초크 선</button><button class="btn coral" id="frscore">채점하기</button></div>`;
  $('#p-stitch .pills').onclick = e => { const b = e.target.closest('.pill'); if (!b) return; stType = b.dataset.k; document.querySelectorAll('#p-stitch .pill').forEach(x => x.classList.toggle('on', x === b)); freeReset(); };
  $('#streset').onclick = freeReset; $('#frundo').onclick = freeUndo; $('#frscore').onclick = () => freeCheck(true);
  $('#frguide').onclick = () => { guideOn = !guideOn; renderFree(); };
  const svg = $('#stsvg');
  const pt = e => { const m = svg.getScreenCTM().inverse(), q = svg.createSVGPoint(); q.x = e.clientX; q.y = e.clientY; const r = q.matrixTransform(m); return { x: r.x, y: r.y }; };

  $('#btsvg').onpointerdown = e => {
    const el = e.target.closest('[data-t]'); if (!el || !cur || !cur.tap) return;
    if (el.dataset.t === cur.tap) { if (two ? cur.tap === 'B' : cur.tap === 'C') bt.lines++; bt.i++; renderButton(); }
    else { el.classList.remove('shake'); void el.getBoundingClientRect(); el.classList.add('shake'); }
  };
}

/* ---------- 5. 평가 ---------- */
const QS = ['수선이 잘되었나요?', '도구를 안전하게 사용했나요?', '수선을 마친 뒤 사용한 재료와 도구를 정리했나요?', '단추가 떨어진 옷을 스스로 수선할 수 있나요?'];
const FACES = ['😀', '😐', '🙁'], FN = ['잘함', '보통', '노력 요함'];
function renderEval() {
  const stm = store.get('stamps', {}), ev = store.get('eval', {});
  $('#p-eval').innerHTML = `<h2>내 도장판</h2><p class="lead">연습을 마치면 도장이 찍혀요. 전부 모아 봐요! (${STAMPS.filter(s => stm[s[0]]).length}/${STAMPS.length})</p>
   <div class="stamps">${STAMPS.map(([k, e, n]) => `<div class="stamp ${stm[k] ? 'got' : ''}"><div class="e">${e}</div>${n}</div>`).join('')}</div>
   <h2>스스로 평가해 봅시다</h2><p class="lead">실제로 옷을 수선해 본 뒤에 골라 보세요.</p>
   <div class="ev">${QS.map((q, i) => `<div class="r"><span>${i + 1}. ${q}</span>${FACES.map((f, k) => `<button class="face ${ev[i] === k ? 'on' : ''}" data-q="${i}" data-k="${k}" title="${FN[k]}">${f}</button>`).join('')}</div>`).join('')}</div>
   <div class="actions"><button class="btn ghost" id="resetall">기록 지우기</button></div>`;
  $('#p-eval .ev').onclick = e => { const b = e.target.closest('.face'); if (!b) return; const v = store.get('eval', {}); v[b.dataset.q] = +b.dataset.k; store.set('eval', v); renderEval(); };
  $('#resetall').onclick = () => { if (confirm('도장과 평가 기록을 모두 지울까요?')) { store.set('stamps', {}); store.set('eval', {}); store.set('quizBest', null); renderEval(); } };
}

renderTools(); renderOrder(); renderStitchShell(); renderButtonShell(); renderEval();
tab(store.get('tab', 'tools'));
</script>
