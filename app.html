<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>바느질 연습장 – 옷의 간단한 수선</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--teal:#1aa0a6;--teal-d:#0f7a80;--teal-l:#d9f3f4;--coral:#ef6f5e;--sun:#ffd34d;--ink:#26323a;--paper:#fffdf6;--ok:#1fae6b}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Gowun Dodum','Malgun Gothic',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.jua,h1,h2,h3,button,.tab{font-family:'Jua','Gowun Dodum',sans-serif;font-weight:400}
header{background:var(--teal);color:#fff;padding:10px 20px 0;position:sticky;top:0;z-index:10;box-shadow:0 3px 10px #0002}
header .row{display:flex;align-items:center;gap:12px}
header h1{font-size:28px;flex:1}
header a{color:#fff;text-decoration:none;background:#ffffff33;padding:4px 14px;border-radius:20px;font-family:Jua;font-size:16px}
nav{scrollbar-width:none;display:flex;gap:6px;overflow-x:auto;padding-top:8px}
.tab{flex:none;background:#ffffff2a;color:#fff;border:0;border-radius:16px 16px 0 0;padding:10px 20px;font-size:21px;cursor:pointer}
.tab.on{background:var(--paper);color:var(--teal-d)}
main{max-width:1000px;margin:0 auto;padding:18px 16px 60px}
.panel{display:none}.panel.on{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
h2{font-size:30px;color:var(--teal-d);margin-bottom:4px}
.lead{font-size:20px;color:#5b6b73;margin-bottom:14px}
.btn{background:var(--teal);color:#fff;border:0;border-radius:30px;padding:12px 28px;font-size:22px;box-shadow:0 5px 0 var(--teal-d);cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--teal-d)}
.btn.coral{background:var(--coral);box-shadow:0 5px 0 #c24a3a}
.btn.ghost{background:#fff;color:var(--teal-d);border:3px solid var(--teal);box-shadow:none}
.pills{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.pill{background:#fff;border:3px solid var(--teal-l);color:var(--teal-d);border-radius:30px;padding:8px 22px;font-size:22px;cursor:pointer}
.pill.on{background:var(--teal);color:#fff;border-color:var(--teal)}
/* tools */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.tcard{background:#fff;border:3px solid var(--teal-l);box-shadow:0 5px 0 var(--teal-l);border-radius:22px;padding:12px;text-align:center;cursor:pointer;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tcard svg{width:90px;height:90px}
.tcard b{font-family:Jua;font-weight:400;font-size:24px;color:var(--teal-d)}
.tcard p{font-size:17px;line-height:1.35;display:none}
.tcard.open{background:var(--teal-l)}.tcard.open svg{width:56px;height:56px}.tcard.open p{display:block}
.quiz{background:#fff;border:3px solid var(--teal-l);border-radius:26px;padding:20px;margin-top:22px;text-align:center}
.quiz .q{font-size:26px;margin:8px 0 14px;font-family:Jua}
.quiz .pic{width:150px;height:150px;margin:0 auto}
.quiz .desc{font-size:26px;background:#fff4cf;border-radius:20px;padding:18px;margin:0 auto 14px;max-width:560px;line-height:1.4}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:560px;margin:0 auto}
.opt{background:#fff;border:3px solid var(--teal);color:var(--teal-d);border-radius:20px;padding:16px;font-size:24px;cursor:pointer}
.opt.good{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.bad{background:#ffd5d0;border-color:var(--coral);color:#a33}
.prog{height:12px;background:var(--teal-l);border-radius:8px;overflow:hidden;margin-bottom:6px}.prog i{display:block;height:100%;background:var(--teal);transition:width .3s}
/* order */
.slots{display:grid;gap:10px;margin-bottom:18px}
.slot{display:flex;align-items:center;gap:12px;min-height:62px;background:#f1ece0;border:3px dashed #d9cfb6;border-radius:18px;padding:8px 16px;font-size:21px}
.slot .n{flex:none;width:38px;height:38px;border-radius:50%;background:#cfc6ae;color:#fff;display:grid;place-items:center;font-family:Jua;font-size:22px}
.slot.f{background:#e5f8ef;border:3px solid var(--ok)}.slot.f .n{background:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:#fff;border:3px solid var(--teal);border-radius:18px;padding:14px 18px;font-size:21px;cursor:pointer;text-align:left;max-width:100%;font-family:inherit;color:var(--ink);box-shadow:0 4px 0 var(--teal-l)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* stitch / button svg */
.board{background:#fff;border:3px solid var(--teal-l);border-radius:26px;padding:10px;touch-action:none}
.board svg{width:100%;height:auto;display:block}
.say{background:#fff4cf;border:3px dashed #e7b92f;border-radius:20px;padding:12px 18px;font-size:23px;margin-bottom:12px;min-height:76px;display:flex;align-items:center;gap:10px}
.pulse{animation:pulse 1s infinite;transform-box:fill-box;transform-origin:center}
@keyframes flashk{from{transform:scale(.3);opacity:1}to{transform:scale(1.6);opacity:0}}.flash{animation:flashk .5s both;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.35);opacity:.55}}
.msg{font-family:Jua;font-size:26px;color:var(--ok);text-align:center;margin:10px 0;height:40px;overflow:hidden}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:10px}
/* eval */
.ev{display:grid;gap:12px}
.ev .r{display:flex;align-items:center;gap:14px;background:#fff;border:3px solid var(--teal-l);border-radius:20px;padding:12px 18px;font-size:21px;flex-wrap:wrap}
.ev .r span{flex:1;min-width:230px}
.face{font-size:40px;background:none;border:3px solid transparent;border-radius:50%;width:60px;height:60px;cursor:pointer;filter:grayscale(1);opacity:.55}
.face.on{filter:none;opacity:1;border-color:var(--teal);background:var(--teal-l)}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:12px 0 26px}
.stamp{background:#fff;border:3px dashed #d9cfb6;border-radius:20px;padding:10px;text-align:center;font-size:18px;color:#aaa}
.stamp .e{font-size:42px;filter:grayscale(1);opacity:.35}
.stamp.got{border:3px solid var(--sun);background:#fff9dc;color:var(--ink)}.stamp.got .e{filter:none;opacity:1}
.lvl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;font-size:20px}.lvl b{font-family:Jua;font-weight:400;color:var(--teal-d)}.lvl span{color:#6b7b83;font-size:18px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.mcard{font:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border:3px solid var(--teal-l);box-shadow:0 5px 0 var(--teal-l);border-radius:24px;padding:18px 12px;cursor:pointer;color:var(--ink);text-align:center}
.mcard:active{transform:translateY(4px);box-shadow:0 1px 0 var(--teal-l)}
.mcard .mi{font-size:46px}.mcard b{font-family:Jua;font-weight:400;font-size:25px;color:var(--teal-d)}.mcard span{font-size:17px;color:#5b6b73}
.mcard em{font-style:normal;font-family:Jua;margin-top:6px;background:var(--coral);color:#fff;border-radius:20px;padding:4px 18px;font-size:19px}
.mcard.got{background:#f2fbf5;border-color:#bfe8cf}.mcard.got em{background:var(--ok)}
.sbar{display:flex;align-items:center;gap:12px;margin-bottom:10px}.sbar b{flex:1;font-size:27px;color:var(--teal-d);text-align:center}
.btn.small{padding:6px 16px;font-size:18px;box-shadow:none}
.stepper{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px;font-family:Jua}
.stp{display:inline-flex;align-items:center;gap:6px;background:#eee8d8;color:#8a8268;border-radius:20px;padding:4px 14px 4px 5px;font-size:18px}
.stp i{font-style:normal;width:26px;height:26px;border-radius:50%;background:#cfc6ae;color:#fff;display:grid;place-items:center;font-size:16px}
.stp.now{background:#fff4cf;color:#8a5a00;box-shadow:0 0 0 3px #ffb300}.stp.now i{background:#ffb300}
.stp.ok{background:#e5f8ef;color:#13804d}.stp.ok i{background:var(--ok)}.arr{color:#b6ad94}
.refbox{display:flex;gap:14px;align-items:center;background:#fff;border:3px solid var(--teal-l);border-radius:20px;padding:10px 14px;margin-bottom:10px;font-size:19px;line-height:1.45}.refbox[hidden]{display:none}
.rcard{background:#fff;border:4px solid #e3ddd0;border-radius:26px;padding:16px 20px;margin-top:14px;text-align:center}.rcard.good{border-color:var(--ok);background:#f2fbf5}
.rcard .rst{font-size:44px}.rcard h3{font-size:28px;color:var(--teal-d);margin:4px 0}.rcard ul{text-align:left;max-width:560px;margin:8px auto;font-size:20px;line-height:1.5;padding-left:26px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,120px);background:var(--ink);color:#fff;padding:12px 26px;border-radius:30px;font-family:Jua;font-size:22px;transition:transform .35s;z-index:30}
.toast.on{transform:translate(-50%,0)}
@media(max-width:600px){header h1{font-size:22px}.opts{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="row"><h1>🧵 바느질 연습장</h1><a href="slides.html">슬라이드</a><a href="index.html">처음으로</a></div>
  <nav id="nav"></nav>
</header>
<main>
  <section class="panel" id="p-tools"></section>
  <section class="panel" id="p-order"></section>
  <section class="panel" id="p-sew"></section>
  <section class="panel" id="p-eval"></section>
</main>
<div class="toast" id="toast"></div>
<script src="art.js"></script>
<script>
const $ = (s, r = document) => r.querySelector(s);
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k, d) { try { const v = localStorage.getItem('sew-' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('sew-' + k, JSON.stringify(v)); } catch (e) {} }
};
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 2200); }
const STAMPS = [
  ['quiz', '🧰', '도구 박사'], ['order0', '📋', '수선 과정 순서'], ['order1', '🧵', '시작매듭 순서'], ['order2', '🪢', '끝매듭 순서'],
  ['running', '🟢', '홈질'], ['back', '🔵', '박음질'], ['basting', '🟠', '시침질'], ['two', '🔘', '두 구멍 단추'], ['shank', '🟡', '기둥 단추']
];
function stamp(k) {
  const s = store.get('stamps', {}); if (s[k]) return;
  s[k] = 1; store.set('stamps', s); toast('🎉 도장을 받았어요! ' + STAMPS.find(x => x[0] === k)[2]); renderEval();
}

/* ---------- 탭 ---------- */
const TABS = [['sew', '🧵 바느질'], ['tools', '🧰 도구'], ['order', '🔢 순서'], ['eval', '⭐ 평가']];
$('#nav').innerHTML = TABS.map(([k, t]) => `<button class="tab" data-k="${k}">${t}</button>`).join('');
function tab(k) {
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.k === k));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id === 'p-' + k));
  store.set('tab', k); scrollTo(0, 0);
}
$('#nav').onclick = e => { const b = e.target.closest('.tab'); if (b) tab(b.dataset.k); };

/* ---------- 1. 도구 ---------- */
const TOOLS = [
  ['옷감', ART.fabric, '바느질의 바탕이 되는 천'], ['시침 핀', ART.pin, '바느질을 하기 위해 옷감을 고정할 때 사용'],
  ['자', ART.ruler, '길이를 재거나 바느질선을 그을 때 사용'], ['바늘', ART.needle, '옷감을 바느질할 때 사용'],
  ['실', ART.thread, '바늘에 연결하여 옷감을 꿰맬 때 사용'], ['초크', ART.chalk, '옷감에 바느질 선을 그을 때 사용'],
  ['가위', ART.scissors, '실을 자를 때 사용'], ['골무', ART.thimble, '바늘귀를 밀 때, 손가락을 바늘로부터 보호하기 위해 사용'],
  ['바늘꽂이', ART.pincushion, '쓰지 않는 바늘과 시침 핀을 꽂아 둘 때 사용'], ['마름질 가위', ART.bigScissors, '옷감을 필요한 모양으로 자를 때 사용']
];
let quiz = null;
function renderTools() {
  $('#p-tools').innerHTML = `<h2>손바느질 재료와 도구</h2><p class="lead">카드를 눌러 어디에 쓰는지 알아봐요. 다 보면 퀴즈에 도전!</p>
   <div class="tgrid">${TOOLS.map((t, i) => `<div class="tcard" data-i="${i}">${t[1]}<b>${t[0]}</b><p>${t[2]}</p></div>`).join('')}</div>
   <div class="quiz" id="quiz"></div>`;
  $('#p-tools .tgrid').onclick = e => { const c = e.target.closest('.tcard'); if (c) c.classList.toggle('open'); };
  renderQuiz();
}
function renderQuiz() {
  const el = $('#quiz'), best = store.get('quizBest', null);
  if (!quiz) {
    el.innerHTML = `<h3 class="jua" style="font-size:28px;color:var(--teal-d)">도구 퀴즈</h3><p class="lead">그림을 보고 이름을 맞히거나, 쓰임새를 보고 도구를 골라요. (10문제)${best != null ? `<br>내 최고 점수: <b>${best}점</b>` : ''}</p>
      <button class="btn coral" id="qstart">퀴즈 시작!</button>`;
    $('#qstart').onclick = () => { quiz = { qs: shuffle(TOOLS).map(t => ({ t, mode: Math.random() < .5 ? 'pic' : 'use' })), i: 0, score: 0, done: false }; renderQuiz(); };
    return;
  }
  if (quiz.i >= quiz.qs.length) {
    const sc = quiz.score * 10;
    if (best == null || sc > best) store.set('quizBest', sc);
    if (sc >= 80) stamp('quiz');
    el.innerHTML = `<div class="pic">${ART.kid('#2b2b3a', '#4fa3d9', sc >= 80 ? 'wow' : 'smile')}</div><div class="q">${quiz.score} / ${quiz.qs.length} 맞혔어요! ${sc >= 80 ? '🎉 대단해요!' : '조금만 더 연습해요!'}</div>
      <button class="btn" id="qagain">다시 도전</button>`;
    $('#qagain').onclick = () => { quiz = null; renderQuiz(); };
    return;
  }
  const { t, mode } = quiz.qs[quiz.i];
  const opts = shuffle([t, ...shuffle(TOOLS.filter(x => x !== t)).slice(0, 3)]);
  el.innerHTML = `<div class="prog"><i style="width:${quiz.i / quiz.qs.length * 100}%"></i></div>
   <div class="q">${quiz.i + 1}번 · ${mode === 'pic' ? '이 도구의 이름은 무엇일까요?' : '이런 일을 할 때 쓰는 도구는?'}</div>
   ${mode === 'pic' ? `<div class="pic">${t[1]}</div>` : `<div class="desc">${t[2]}</div>`}
   <div class="opts">${opts.map((o, k) => `<button class="opt" data-k="${k}">${o[0]}</button>`).join('')}</div>`;
  let locked = false;
  el.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if (locked) return;
    const ok = opts[b.dataset.k] === t;
    if (ok) { locked = true; quiz.score++; b.classList.add('good'); setTimeout(() => { quiz.i++; renderQuiz(); }, 700); }
    else { locked = true; b.classList.add('bad', 'shake'); el.querySelectorAll('.opt').forEach(o => { if (opts[o.dataset.k] === t) o.classList.add('good'); }); setTimeout(() => { quiz.i++; renderQuiz(); }, 1300); }
  });
}

/* ---------- 2. 순서 ---------- */
const ORDERS = [
  { name: '수선하는 과정', items: ['망가진 부분을 확인하고 바느질 방법 계획하기', '도구 준비하기', '바늘에 실을 꿰고 시작매듭 짓기', '바느질하기', '끝매듭 짓기', '도구 정리하기'] },
  { name: '실 꿰기와 시작매듭', items: ['바늘귀에 꿰기 쉽도록 실을 깔끔하게 자른다', '바늘귀에 실 끝을 꿴다', '실 끝을 집게손가락에 한 바퀴 감는다', '엄지·집게손가락으로 밀어 매듭 고리를 만든다', '고리를 실 끝으로 잡아당겨 매듭을 짓는다'] },
  { name: '끝매듭 짓기', items: ['옷감 안쪽에서 매듭짓기를 시작한다', '바늘 끝에 실을 두세 번 감는다', '감은 실을 누르며 바늘을 빼내 매듭을 짓는다', '가위로 실을 조금 남기고 자른다'] }
];
let ordSet = 0, ordState = null;
function renderOrder() {
  const o = ORDERS[ordSet];
  if (!ordState || ordState.set !== ordSet) ordState = { set: ordSet, n: 0, chips: shuffle(o.items.map((t, i) => [i, t])) };
  const st = ordState, done = st.n >= o.items.length;
  $('#p-order').innerHTML = `<h2>순서대로 눌러 보세요</h2><p class="lead">처음 할 일부터 차례대로 눌러요. 틀리면 흔들려요!</p>
   <div class="pills">${ORDERS.map((x, i) => `<button class="pill ${i === ordSet ? 'on' : ''}" data-s="${i}">${x.name}</button>`).join('')}</div>
   <div class="slots">${o.items.map((t, i) => `<div class="slot ${i < st.n ? 'f' : ''}"><span class="n">${i + 1}</span>${i < st.n ? t : ''}</div>`).join('')}</div>
   ${done ? `<div class="msg">🎉 순서를 모두 맞혔어요!</div><div class="actions"><button class="btn" id="oagain">다시 섞기</button></div>`
     : `<div class="chips">${st.chips.filter(c => c[0] >= st.n).map(c => `<button class="chip" data-i="${c[0]}">${c[1]}</button>`).join('')}</div>`}`;
  $('#p-order .pills').onclick = e => { const b = e.target.closest('.pill'); if (b) { ordSet = +b.dataset.s; ordState = null; renderOrder(); } };
  if (done) { stamp('order' + ordSet); $('#oagain').onclick = () => { ordState = null; renderOrder(); }; return; }
  $('#p-order .chips').onclick = e => {
    const b = e.target.closest('.chip'); if (!b) return;
    if (+b.dataset.i === st.n) { st.n++; renderOrder(); }
    else { b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); }
  };
}

/* ---------- 3. 바느질 연습: 펜으로 실을 움직여 천의 앞면·뒷면을 바느질 ---------- */
const VW = 900, VH = 470, FY0 = 40, FY1 = 190, BY0 = 280, BY1 = 430, OFF = 240, LINEY = 115;
const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
const seqOf = (ids, n) => Array.from({ length: n }, () => ids).flat();
const MISSIONS = {
  running: { kind: 'stitch', name: '홈질', icon: '🟢', color: '#1fae6b', desc: '겉과 안의 바늘땀 길이가 같게', dots: range(0, 17).map(i => 70 + i * 45) },
  back: { kind: 'stitch', name: '박음질', icon: '🔵', color: '#2f7fd0', desc: '한 땀 뒤로, 두 땀 앞으로', dots: range(0, 17).map(i => 70 + i * 45) },
  basting: { kind: 'stitch', name: '시침질', icon: '🟠', color: '#e08a2d', desc: '겉은 길게, 안은 짧게', dots: [0, 3, 4, 7, 8, 11, 12, 15, 16].map(i => 70 + i * 45) },

  }
  if (even < .65) issues.push('바늘땀 길이를 비슷하게 맞춰 보세요');
  if (rms > 14) issues.push('줄을 곧게! 한 줄로 나란히 떠 보세요');
  return { pass: !issues.length, issues, stars: even > .85 && rms < 8 ? 3 : 2 };
}
function sewCheck(quiet) {
  const r = freeEval(), name = S.M.name;
  if (r.need) { if (!quiet) setMsg(`${name} 잘 가고 있어요! 조금만 더 해 봐요.`); return; }
  if (r.pass) {
    setMsg(`${'⭐'.repeat(r.stars)}${'☆'.repeat(3 - r.stars)} 잘했어요! 제대로 된 ${name}이에요! 뒷면으로 내려가 끝매듭을 지어요.`, '#1fae6b');
    S.praiseUntil = Date.now() + 2600; setTimeout(() => S && render(), 2700);
  } else if (!quiet) setMsg('💡 ' + r.issues[0], '#b8731a');
}
function finish() {
  const M = S.M, knots = S.knot1 && S.knot2 && (!M.wrap || S.wrapped);
  let pass = true, stars = 3, issues = [];
  if (M.kind === 'stitch') { const r = freeEval(); pass = r.pass; issues = r.issues || []; stars = r.pass ? r.stars : 1; }
  if (!knots) { stars = Math.min(stars, 2); issues = issues.concat(['시작·끝매듭과 실기둥을 모두 해야 실이 빠지지 않아요']); }
  S.phase = 'done'; S.result = { pass, stars, issues, knots };
  const ok = pass && knots; if (ok) stamp(S.id);
  ui(); render(); setMsg('');
  const next = ORDER_IDS[ORDER_IDS.indexOf(S.id) + 1];
  $('#sres').innerHTML = `<div class="rcard ${ok ? 'good' : ''}"><div class="rst">${'⭐'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
    <h3 class="jua">${ok ? `👏 잘했어요! 제대로 된 ${M.name}이에요!` : '조금만 더 연습해 볼까요?'}</h3>
    ${issues.length ? `<ul>${issues.slice(0, 3).map(t => `<li>${t}</li>`).join('')}</ul>` : '<p>바늘땀과 매듭, 정리까지 모두 훌륭해요.</p>'}
    <div class="actions"><button class="btn coral" id="rag">다시 하기</button>${next ? `<button class="btn" id="rnx">다음: ${MISSIONS[next].name} ▶</button>` : ''}<button class="btn ghost" id="rls">미션 목록</button></div></div>`;
  $('#rag').onclick = () => sewStart(S.id); $('#rls').onclick = sewList; if (next) $('#rnx').onclick = () => sewStart(next);
  $('#sres').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/* ----- 그리기 ----- */
function needleG(x, y, ang, faded) {
  return `<g transform="translate(${x} ${y}) rotate(${ang})" opacity="${faded ? .6 : 1}" style="filter:drop-shadow(0 4px 3px #0003)">
    <path d="M0 0 L-70 -4.5 L-98 -4.5 L-98 4.5 L-70 4.5Z" fill="#d5dde4" stroke="#7d8996" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="-88" cy="0" rx="6" ry="2" fill="#5f6b77"/><line x1="-66" y1="-2" x2="-6" y2="-0.6" stroke="#fff" stroke-width="1.5" stroke-opacity=".8"/></g>`;
}
function say() {
  const ph = S.phase, M = S.M, F = S.stitches.filter(s => s.side === 'front').length;
  const t = { knot1: '🧶 <b>시작매듭</b>: 펜으로 흰 칸에 동그라미를 2번 그려 실을 손가락에 감아요',
    sew: !S.pos ? '🪡 천의 <b>뒷면(아래 천)</b>에서 바늘이 올라올 곳을 눌러요' : S.pos.side === 'front' ? '✍ <b>앞면</b>: 바늘을 잡고 실을 끌다가 <b>들어갈 곳</b>에서 펜을 떼요' : '🔄 <b>뒷면</b>: 바늘을 잡고 실을 끌다가 <b>올라올 곳</b>에서 펜을 떼요',
    wrap: '🧵 <b>실기둥</b>: 단추와 옷 사이에서 실을 감아요 — 동그라미를 2번 그려요',
    knot2: '🪢 <b>끝매듭</b>: 바늘 끝에 실을 두세 번 감아요 — 동그라미를 2번 그려요',
    tidy: '🧷 <b>정리</b>: 바늘을 잡고 오른쪽 <b>바늘꽂이</b>에 꽂아요', done: '🎉 모두 끝났어요!' }[ph];
  $('#say').innerHTML = `<div>${t}</div><span style="color:#7a8a92;font-size:19px;margin-left:auto">${M.kind === 'stitch' ? `겉 바늘땀 ${F}개` : `${Math.min(S.k, M.seq.length)}/${M.seq.length}`}</span>`;
}
function render() {
  if (!S) return;
  const M = S.M, col = M.color, ph = S.phase, d = S.drag;
  const actSide = ph === 'sew' ? (S.pos ? S.pos.side : 'back') : null;
  let g = `<defs><pattern id="weave" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M0 7H14M7 0V14" stroke="#c9ab63" stroke-width=".9" opacity=".45"/></pattern></defs>`;
  [['front', FY0, '앞면(겉)'], ['back', BY0, '뒷면(안) — 천을 뒤집어서 본 모습']].forEach(([sd, y0, lb]) => {
    g += `<rect x="20" y="${y0}" width="860" height="150" rx="18" fill="${sd === 'back' ? '#ecd9aa' : '#fbe9bd'}"/><rect x="20" y="${y0}" width="860" height="150" rx="18" fill="url(#weave)"/>
     <rect x="20" y="${y0}" width="860" height="150" rx="18" fill="none" stroke="${actSide === sd ? '#ffb300' : '#d9bd78'}" stroke-width="${actSide === sd ? 7 : 4}"/>
     <text x="30" y="${y0 - 10}" font-size="21" font-family="Jua" fill="${actSide === sd ? '#b87500' : '#8a7338'}">${lb}${actSide === sd ? ' ◀ 지금 여기' : ''}</text>`;
  });
  g += `<text x="${VW / 2}" y="246" font-size="20" text-anchor="middle" fill="#9a8a5a" font-family="Gowun Dodum">↕ 앞면과 뒷면은 같은 구멍으로 이어져 있어요</text>`;
  /* 초크 / 단추 */
  if (M.kind === 'stitch') {
    if (sewLevel <= 2) g += `<line x1="50" y1="${LINEY}" x2="850" y2="${LINEY}" stroke="#7fcfe0" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 10" opacity=".9"/>`;
    if (sewLevel === 1) M.dots.forEach(x => { g += `<circle cx="${x}" cy="${LINEY}" r="7" fill="#fff" stroke="#3a95ab" stroke-width="2.5"/>`; });
  } else {
    const A = M.targets.A, B = M.targets.B;
    if (S.id === 'two') g += `<circle cx="450" cy="115" r="62" fill="#f4b942" stroke="#d98f1c" stroke-width="5"/><circle cx="450" cy="115" r="46" fill="none" stroke="#d98f1c" stroke-width="2.5"/><circle cx="${A.x}" cy="${A.y}" r="9" fill="#7a4c0a"/><circle cx="${B.x}" cy="${B.y}" r="9" fill="#7a4c0a"/><text x="${A.x}" y="${A.y - 16}" text-anchor="middle" font-size="20" font-family="Jua" fill="#7a4c0a">①</text><text x="${B.x}" y="${B.y - 16}" text-anchor="middle" font-size="20" font-family="Jua" fill="#7a4c0a">②</text>`;
    else g += `<circle cx="450" cy="105" r="62" fill="#c8932f" stroke="#8b6218" stroke-width="5"/><circle cx="450" cy="105" r="44" fill="#e0b050" stroke="#8b6218" stroke-width="2"/><path d="M450 78 l27 27 l-27 27 l-27 -27z" fill="#8b6218"/><path d="M425 140 Q450 95 475 140" fill="none" stroke="#6b4a12" stroke-width="8" stroke-linecap="round"/><text x="450" y="176" text-anchor="middle" font-size="18" font-family="Gowun Dodum" fill="#7a5a14">단추 고리</text>`;
  }
  /* 실 */
  const P = (p, off) => `${p.x.toFixed(1)} ${(p.y + off).toFixed(1)}`, path = (pts, off) => 'M' + pts.map(p => P(p, off)).join(' L');
  const segs = S.stitches.map(s => {
    let pts = [s.a, s.b];
    if (S.pull && S.pull.s === s) { const t = Math.min(1, S.pull.t), e = 1 - (1 - t) * (1 - t), N = S.pull.res.length; pts = S.pull.res.map((p, j) => ({ x: p.x + (s.a.x + (s.b.x - s.a.x) * j / (N - 1) - p.x) * e, y: p.y + (s.a.y + (s.b.y - s.a.y) * j / (N - 1) - p.y) * e })); }
    return { s, pts };
  });
  segs.forEach(({ s, pts }) => { g += `<path d="${path(pts, s.side === 'front' ? OFF : 0)}" fill="none" stroke="${col}" stroke-width="5" stroke-dasharray="8 9" stroke-linecap="round" opacity=".22"/>`; });
  const holes = []; S.stitches.forEach(s => holes.push(s.a, s.b)); if (S.startPt) holes.push(S.startPt);
  holes.forEach(p => { g += `<circle cx="${p.x}" cy="${p.y}" r="4.5" fill="#6b4a0f" opacity=".85"/><circle cx="${p.x}" cy="${p.y + OFF}" r="4.5" fill="#6b4a0f" opacity=".85"/>`; });
  segs.forEach(({ s, pts }) => { g += `<path d="${path(pts, s.side === 'front' ? 0 : OFF)}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>`; });
  /* 매듭 */
  const knot = (p, r) => `<circle cx="${p.x}" cy="${p.y + OFF}" r="${r}" fill="${col}" stroke="#fff" stroke-width="2.5"/><circle cx="${p.x - r / 3}" cy="${p.y + OFF - r / 3}" r="${r / 3}" fill="#fff" opacity=".45"/>`;
  if (S.knot1 && S.startPt) g += knot(S.startPt, 11);
  if (S.knot2 && S.pos) g += knot(S.pos, 15);
  /* 안내 반짝이 */
  if (ph === 'sew' && M.kind === 'button') {
    const T = expected();
    if (T) { const needSide = !S.pos ? 'back' : S.pos.side; g += `<circle class="pulse" cx="${T.x}" cy="${T.y + (needSide === 'back' ? OFF : 0)}" r="17" fill="#ffd34d" stroke="#e0a800" stroke-width="3"/>`; }
  }
  if (S.flash) g += `<circle class="flash" cx="${S.flash.x}" cy="${S.flash.y + (S.flash.side === 'back' ? OFF : 0)}" r="28" fill="none" stroke="#ffd34d" stroke-width="6"/>`;
  /* 끌고 있는 실 */
  if (d) { const off = S.pos.side === 'back' ? OFF : 0; g += `<path d="${path(d.pts.concat([{ x: d.x, y: d.y }]), off)}" fill="none" stroke="${col}" stroke-width="${5 + (d.pressure || .5) * 5}" stroke-linecap="round" stroke-linejoin="round"/>`; }
  /* 바늘꽂이 */
  g += `<g transform="translate(765 190)" opacity="${ph === 'tidy' ? 1 : .55}">${ph === 'tidy' ? '<circle class="pulse" cx="45" cy="46" r="48" fill="#ffd34d" opacity=".5"/>' : ''}${ART.pincushion.replace('<svg ', '<svg width="90" height="90" ')}</g>`;
  /* 바늘 */
  if (ph === 'sew') {
    if (S.pos) { const side = S.pos.side, off = side === 'back' ? OFF : 0, last = S.stitches[S.stitches.length - 1];
      g += d ? needleG(d.x, d.y + off, d.ang, false) : needleG(S.pos.x, S.pos.y + off, last && last.b.x < last.a.x ? 168 : 12, false); }
    else g += `<text x="${VW / 2}" y="${BY0 + 80}" font-size="26" text-anchor="middle" font-family="Jua" fill="#7a6a4a">👆 바늘이 올라올 곳을 눌러요</text>`;
  } else if (ph === 'knot2' || ph === 'wrap') { /* 제자리 바늘 */ }
  if (ph === 'tidy' && S.pos) { const t = S.tidyDrag; g += t ? needleG(t.x, t.y, t.ang, false) : needleG(S.pos.x, S.pos.y + OFF, 12, false); }
  if (ph === 'done' && S.cushion) g += needleG(826, 224, -50, false);
  /* 칭찬 */
  if (Date.now() < S.praiseUntil) g += `<g><rect x="290" y="2" width="320" height="36" rx="18" fill="#fff" stroke="#1fae6b" stroke-width="4"/><text x="450" y="29" font-size="26" text-anchor="middle" font-family="Jua" fill="#1fae6b">👏 잘했어요!</text></g>`;
  /* 매듭 동작 칸 */
  if (S.gest) {
    const gs = S.gest, title = { knot1: '시작매듭 짓기', wrap: '실기둥 만들기', knot2: '끝매듭 짓기' }[ph], prog = Math.min(1, Math.abs(gs.total) / gs.need);
    g += `<rect x="0" y="0" width="${VW}" height="${VH}" fill="#26323a" opacity=".55"/>
     <rect x="${CARD.x}" y="${CARD.y}" width="${CARD.w}" height="${CARD.h}" rx="26" fill="#fff" stroke="${col}" stroke-width="6"/>
     <text x="${CARD.x + 24}" y="${CARD.y + 38}" font-size="28" font-family="Jua" fill="#0f7a80">🧶 ${title}</text>
     <text x="${CARD.x + CARD.w - 24}" y="${CARD.y + 38}" font-size="19" text-anchor="end" font-family="Gowun Dodum" fill="#6b7b83">펜으로 동그라미를 2번 그려요</text>
     <rect x="${CARD.x + 24}" y="${CARD.y + CARD.h - 22}" width="${CARD.w - 48}" height="10" rx="5" fill="#d9f3f4"/><rect x="${CARD.x + 24}" y="${CARD.y + CARD.h - 22}" width="${(CARD.w - 48) * prog}" height="10" rx="5" fill="${col}"/>`;
    if (!gs.ok && !gs.pts.length) g += `<circle cx="${CARD.x + CARD.w / 2}" cy="${CARD.y + 135}" r="52" fill="none" stroke="#cfe7ea" stroke-width="5" stroke-dasharray="9 9"/><text x="${CARD.x + CARD.w / 2}" y="${CARD.y + 143}" font-size="34" text-anchor="middle">☝️</text>`;
    if (gs.pts.length > 1) g += `<path d="${'M' + gs.pts.map(p => p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join(' L')}" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>`;
    if (gs.ok) g += `<circle cx="${CARD.x + CARD.w / 2}" cy="${CARD.y + 140}" r="40" fill="${col}" stroke="#fff" stroke-width="5"/><circle cx="${CARD.x + CARD.w / 2 - 12}" cy="${CARD.y + 128}" r="12" fill="#fff" opacity=".45"/><text x="${CARD.x + CARD.w / 2}" y="${CARD.y + 215}" font-size="30" text-anchor="middle" font-family="Jua" fill="#1fae6b">매듭이 지어졌어요! ✨</text>`;
  }
  $('#ssvg').innerHTML = g; say();
}

/* ---------- 5. 평가 ---------- */
const QS = ['수선이 잘되었나요?', '도구를 안전하게 사용했나요?', '수선을 마친 뒤 사용한 재료와 도구를 정리했나요?', '단추가 떨어진 옷을 스스로 수선할 수 있나요?'];
const FACES = ['😀', '😐', '🙁'], FN = ['잘함', '보통', '노력 요함'];
function renderEval() {
  const stm = store.get('stamps', {}), ev = store.get('eval', {});
  $('#p-eval').innerHTML = `<h2>내 도장판</h2><p class="lead">연습을 마치면 도장이 찍혀요. 전부 모아 봐요! (${STAMPS.filter(s => stm[s[0]]).length}/${STAMPS.length})</p>
   <div class="stamps">${STAMPS.map(([k, e, n]) => `<div class="stamp ${stm[k] ? 'got' : ''}"><div class="e">${e}</div>${n}</div>`).join('')}</div>
   <h2>스스로 평가해 봅시다</h2><p class="lead">실제로 옷을 수선해 본 뒤에 골라 보세요.</p>
   <div class="ev">${QS.map((q, i) => `<div class="r"><span>${i + 1}. ${q}</span>${FACES.map((f, k) => `<button class="face ${ev[i] === k ? 'on' : ''}" data-q="${i}" data-k="${k}" title="${FN[k]}">${f}</button>`).join('')}</div>`).join('')}</div>
   <div class="actions"><button class="btn ghost" id="resetall">기록 지우기</button></div>`;
  $('#p-eval .ev').onclick = e => { const b = e.target.closest('.face'); if (!b) return; const v = store.get('eval', {}); v[b.dataset.q] = +b.dataset.k; store.set('eval', v); renderEval(); };
  $('#resetall').onclick = () => { if (confirm('도장과 평가 기록을 모두 지울까요?')) { store.set('stamps', {}); store.set('eval', {}); store.set('quizBest', null); renderEval(); } };
}

renderTools(); renderOrder(); sewList(); renderEval();
{ const t0 = store.get('tab', 'sew'); tab(TABS.some(x => x[0] === t0) ? t0 : 'sew'); }
</script>
